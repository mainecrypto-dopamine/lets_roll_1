<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Let's Roll">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="backend.js"></script>
<script src="install.js"></script>
<title>Let's Roll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Mali:wght@600;700&family=Zilla+Slab:wght@700&display=swap" rel="stylesheet">
<style>
/* VOICE: cheerful and playful, a little toy dispatch app for a family and their driver; bilingual.
   IDEA: a sticker sheet + toy road: round place stickers you tap 1-2-3 to build the day's drive.
   PICTURE: the grid of big round place badges with number bubbles, and the road that fills as you tap.
   COLOUR and TYPE: sky blue, sunny yellow, bubblegum pink on white; Mali (rounded, Thai+Latin) for titles, Anuphan body.
   LAYOUT: sky band with day bubbles; planner card; trip ticket; places; one column on phones. */
:root{color-scheme:light dark;
--bg:light-dark(#f3f6ff,#0f1328);--card:light-dark(#fff,#1a2042);--ink:light-dark(#1b2140,#eef1ff);--mute:light-dark(#646d8f,#a3abcf);
--line:light-dark(#e2e7f7,#2b3363);--sky:light-dark(#4a74ff,#3d63e6);--sky2:light-dark(#eaf0ff,#232c5a);--sun:#ffd23f;--pink:#ff6fae;--red:light-dark(#d93a4a,#ff8592)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Anuphan,system-ui,sans-serif;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,.fun{font-family:Mali,Anuphan,sans-serif}
.sky{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line);padding:calc(18px + env(safe-area-inset-top)) max(5vw,16px) 0;position:relative;overflow:hidden}
.road{position:relative;height:26px;margin:0 calc(-1*max(5vw,16px));background:light-dark(#eef0f6,#23284a);overflow:hidden}
.road i{position:absolute;top:11px;left:0;width:200%;height:4px;background:repeating-linear-gradient(90deg,light-dark(#ffffff,#3a4170) 0 26px,transparent 26px 46px);animation:mv 1.2s linear infinite}
@keyframes mv{to{transform:translateX(-46px)}}
.road .rl{position:absolute;bottom:1px;width:24px;height:24px;animation:rl 9s linear infinite}
.road .rl svg{width:24px;height:24px;animation:spin .9s linear infinite;display:block}
@keyframes rl{from{left:-40px}to{left:100%}}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:900px;margin:auto}
.brand{font:700 20px Mali,sans-serif;display:flex;gap:8px;align-items:center}
.brand{font-size:24px}.brand svg{width:40px;height:40px}.brand .wheel{animation:spin 8s linear infinite}.brand:hover .wheel,.go:hover~* .wheel{animation-duration:1s}
.seg{display:flex;background:light-dark(#f1f3f8,#262c52);border-radius:999px;padding:4px}
.seg button{border:0;background:none;color:var(--mute);padding:8px 16px;border-radius:999px;min-height:40px;cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(20,30,80,.15)}
.stats{max-width:900px;margin:10px auto 0;font-size:15px;color:var(--mute)}
.stats b{background:var(--sun);color:#3b2b00;border-radius:999px;padding:1px 10px;margin:0 2px}
.week{display:flex;gap:10px;overflow-x:auto;padding:16px 2px 20px;max-width:900px;margin:auto;scrollbar-width:none}
.day{flex:none;width:58px;height:74px;border:0;background:light-dark(#f1f3f8,#262c52);color:var(--ink);border-radius:22px;cursor:pointer;position:relative;transition:transform .15s}
.day b{display:block;font:700 22px/1.1 Mali,sans-serif}.day span{font-size:13px}
.day[aria-pressed=true]{background:var(--pink);color:#fff;transform:translateY(-3px)}
.day i{position:absolute;top:-4px;right:-2px;width:18px;height:18px;border-radius:50%;background:var(--sun);border:3px solid var(--card)}
.day i.accepted{background:var(--sky)}.day[aria-pressed=true] i.accepted{background:var(--sky)}.day i.declined{background:var(--pink)}
main{max-width:900px;margin:auto;padding:22px max(5vw,16px) 70px;display:grid;gap:22px}
.card{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 2px 0 var(--line),0 16px 36px -22px rgba(30,50,140,.45)}
h2{margin:0 0 16px;font-size:clamp(26px,5vw,34px);line-height:1.1;text-wrap:balance}
h3{margin:0 0 10px;font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
.tile{position:relative;border:0;background:none;cursor:pointer;display:grid;justify-items:center;gap:6px;padding:6px 2px;border-radius:20px;font-weight:600;font-size:14px;line-height:1.25;text-align:center}
.tile:active .bdg{transform:scale(.92)}
.bdg{position:relative;width:84px;height:84px;border-radius:50%;background:var(--b,#4a74ff);color:#fff;display:grid;place-content:center;text-align:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.4);transition:transform .15s;font:700 26px/1 Mali,sans-serif;flex:none}
.bdg small{font:700 9px/1 "Zilla Slab",serif;letter-spacing:.06em}.bdg.slab b{font:700 30px/1 "Zilla Slab",serif}
.bdg.plus{background:var(--sky2);color:var(--sky);font-size:40px;box-shadow:inset 0 0 0 3px var(--sky)}
.tile[aria-pressed=true] .bdg{box-shadow:0 0 0 4px var(--card),0 0 0 8px var(--sun),0 6px 14px -6px rgba(0,0,0,.4)}
.num{position:absolute;top:0;right:calc(50% - 50px);width:32px;height:32px;border-radius:50%;background:var(--pink);color:#fff;font:700 18px/32px Mali,sans-serif;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.newbox{display:flex;gap:8px;margin-top:14px}
.road{list-style:none;margin:6px 0 0;padding:0 0 0 18px;border-left:6px dashed var(--sun);display:grid;gap:10px}
.road li{display:grid;grid-template-columns:34px minmax(0,1fr) 40px;gap:10px;align-items:center;margin-left:-38px;background:var(--sky2);border-radius:16px;padding:8px 10px;animation:pop .3s ease-out}
.road .n{width:34px;height:34px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font:700 17px Mali,sans-serif}
.road .x{border:0;background:none;font-size:22px;color:var(--mute);cursor:pointer;min-height:40px}
.empty-road{color:var(--mute);margin:6px 0 0}
.times{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tchip{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;white-space:nowrap}
.tchip[aria-pressed=true]{background:var(--sky);border-color:var(--sky);color:#fff}
.sect{margin-top:22px}
.switch{display:flex;gap:12px;align-items:center;font-weight:600;cursor:pointer}
.switch input{appearance:none;width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--sun)}.switch input:checked::after{left:25px}
input[type=time],input[type=text],textarea{width:100%;font-size:16px;padding:11px 14px;border:2px solid var(--line);border-radius:16px;background:var(--card)}
textarea{min-height:70px;resize:vertical}
label{display:grid;gap:6px;font-weight:600}
.go{width:100%;min-height:60px;border:0;border-radius:20px;background:var(--pink);color:#fff;font:700 22px Mali,sans-serif;cursor:pointer;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15);margin-top:22px}
.go:disabled{opacity:.6}
.lane{position:relative;height:40px;margin-top:12px;border-bottom:4px dashed var(--line);overflow:hidden}
.lane svg{position:absolute;left:0;bottom:0;width:64px;height:36px}
.lane.drive svg{animation:drive 1.3s ease-in forwards}
@keyframes drive{60%{transform:translateX(calc(100cqw - 64px))}100%{transform:translateX(calc(100cqw + 10px))}}
.lane{container-type:inline-size}
.status{font-size:14px;color:var(--mute);min-height:1.4em;margin:8px 0 0}
a.btn,button.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:14px;border:2px solid var(--sky);background:var(--card);color:var(--sky);font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.main{background:var(--sky);color:#fff}.btn.warn{border-color:var(--red);color:var(--red)}.btn.ghost{border-color:var(--line);color:var(--ink)}.btn.yes{background:var(--sun);border-color:var(--sun);color:#3b2b00;font-size:18px;min-height:54px;padding:0 24px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.thead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.thead h2{margin:0;font-size:24px}
.pill{font-size:14px;font-weight:600;padding:4px 12px;border-radius:999px;background:#fff1bf;color:#6b5200;white-space:nowrap}
.pill.accepted{background:var(--sky);color:#fff}.pill.declined{background:#ffe0ec;color:#a3164f}.pill.cancelled{background:#e9e9ee;color:#55555f;text-decoration:line-through}
.btn.cancel{background:var(--red);color:#fff;border-color:var(--red);min-height:52px;flex:1 1 100%;font-size:17px}
.cxl{background:#f3f3f6;border-radius:14px;padding:10px 12px;font-weight:700;color:#55555f}
.tk{position:relative;display:grid;gap:16px}
.when{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.when strong{font:700 clamp(42px,9vw,58px)/1 Mali,sans-serif;color:var(--sky);white-space:nowrap}
.when span{color:var(--mute)}
.long{display:inline-block;background:var(--sun);color:#3b2b00;font-weight:600;font-size:14px;padding:3px 10px;border-radius:8px}
ol.stops{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.stops li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:18px;background:var(--sky2)}
.stops .bdg{width:52px;height:52px;font-size:17px}.stops .bdg.slab b{font-size:19px}.stops .bdg small{font-size:6px}
.stops .nm{font-weight:600;font-size:18px;line-height:1.3;overflow-wrap:anywhere}.stops .sub{color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.pimg{grid-column:1/-1;width:100%;max-height:220px;object-fit:cover;border-radius:14px}
.tel{color:var(--sky);font-weight:600;text-decoration:none;font-size:15px}
.note{border-left:5px solid var(--sun);padding:6px 12px;background:light-dark(#fffae6,#2a2614);border-radius:0 12px 12px 0}
.note small{display:block;color:var(--mute);font-size:13px}
.stamp{display:inline-block;transform:rotate(-8deg);border:4px solid var(--sky);color:var(--sky);border-radius:14px;padding:2px 12px;font:700 22px Mali,sans-serif;background:var(--card);pointer-events:none}
.stamp.anim{animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.empty{text-align:center;color:var(--mute);padding:10px 0}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border-radius:18px;border:2px solid var(--line);cursor:pointer;text-align:start;width:100%}
.item .sub{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:start;padding:14px;background:var(--card);border-radius:20px;border:2px solid var(--line)}
.place .sub{color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.place .pimg{max-height:180px}
.place .acts{grid-column:1/-1}
details summary{cursor:pointer;font-weight:600;color:var(--sky);min-height:44px;display:flex;align-items:center}
form.add{display:grid;gap:12px;margin-top:8px}
.rolo{position:relative}
.deck{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:34px 4px 18px;scrollbar-width:none;overscroll-behavior-x:contain}
.deck::-webkit-scrollbar{display:none}
.icard{flex:0 0 min(86%,420px);scroll-snap-align:center;position:relative;background:var(--card);border-radius:6px 18px 18px 18px;padding:20px 18px 16px;
 background-image:linear-gradient(90deg,transparent 46px,color-mix(in srgb,var(--pink) 55%,transparent) 46px 48px,transparent 48px),repeating-linear-gradient(180deg,transparent 0 31px,color-mix(in srgb,var(--sky) 22%,transparent) 31px 32px);
 box-shadow:0 2px 0 var(--line),0 18px 30px -20px rgba(30,50,140,.55);display:grid;gap:10px;align-content:start;transition:transform .25s}
.icard .tab{position:absolute;top:-30px;left:var(--x,16px);max-width:60%;height:32px;padding:0 16px;border-radius:12px 12px 0 0;background:var(--card);font:700 16px/32px Mali,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 -2px 0 var(--line)}
.icard .tab::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--b);margin-inline-end:8px}
.icard .hd{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;padding-inline-start:44px}
.icard .bdg{width:72px;height:72px;font-size:22px}.icard .bdg.slab b{font-size:26px}.icard .bdg small{font-size:8px}
.icard .nm{font:700 22px/1.15 Mali,sans-serif}.icard .sub{color:var(--mute);font-size:14px;overflow-wrap:anywhere;line-height:32px;padding-inline-start:44px}
.icard .pimg{max-height:170px}
.icard .row{padding-inline-start:44px}
.icard.blank{place-content:center;justify-items:center;text-align:center;min-height:260px;cursor:pointer;border:0;color:var(--sky);font-weight:600}
.icard.blank .bdg{margin-bottom:6px}
.flip{position:absolute;top:50%;width:44px;height:44px;border-radius:50%;border:0;background:var(--sky);color:#fff;font-size:22px;cursor:pointer;z-index:2;box-shadow:0 6px 14px -6px rgba(0,0,0,.4)}
.flip.prev{left:-6px}.flip.next{right:-6px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.tabs button{flex:none;min-height:40px;padding:0 14px;border-radius:0 0 12px 12px;border:2px solid var(--line);border-top:0;background:var(--card);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button[aria-current=true]{background:var(--sky);border-color:var(--sky);color:#fff}
@media(max-width:600px){.flip{display:none}}
.sos{justify-self:center;margin-top:8px;min-height:44px;padding:0 16px 0 10px;border:0;border-radius:999px;background:#e5243b;color:#fff;font:700 15px Mali,sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.sos span{width:24px;height:24px;border-radius:50%;background:#fff;color:#e5243b;display:grid;place-items:center;font-size:20px;line-height:1}
.veil{position:fixed;inset:0;background:rgba(10,14,30,.55);z-index:10;display:grid;align-items:end;justify-items:center}
.sheet{width:min(100%,560px);max-height:92vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));display:grid;gap:14px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0;font-size:28px}.sheet .close{justify-self:end;margin-bottom:-44px;position:relative;z-index:2}
.hosp{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;padding:14px;border-radius:20px;background:light-dark(#fff0f2,#3a1820)}
.hosp .bdg{width:72px;height:72px}
.big{width:100%;min-height:58px;border-radius:18px;border:0;font:700 19px Mali,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center;padding:6px 14px}
.big.red{background:#e5243b;color:#fff}.big.blue{background:var(--sky);color:#fff}.big.soft{background:var(--sky2);color:var(--sky)}
.sosnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sosnums a{display:grid;justify-items:center;padding:10px 4px;border-radius:16px;border:2px solid var(--line);text-decoration:none;color:var(--ink);font-size:13px;text-align:center}
.sosnums b{font:700 24px Mali,sans-serif;color:#e5243b}
.alert{background:#e5243b;color:#fff;border-radius:24px;padding:18px 20px;display:grid;gap:12px;animation:pulse 1.6s ease-in-out 3}
.alert h2{margin:0;font-size:26px;color:#fff}.alert .sub{opacity:.92}
.alert .btn{border-color:#fff;color:#e5243b;background:#fff}.alert .btn.ghost{background:transparent;color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(229,36,59,.25)}}
select{width:100%;font-size:16px;padding:11px 14px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink)}
main{padding-bottom:110px}
.shiny{position:relative;overflow:hidden;width:100%;min-height:62px;border:0;border-radius:20px;cursor:pointer;color:#fff;font:700 20px Mali,sans-serif;
 background:linear-gradient(110deg,#5b2bff,#c13cff,#ff3fa4,#ffb020,#2fd1ff,#5b2bff);background-size:300% 100%;animation:glow 6s linear infinite;box-shadow:0 10px 26px -10px #c13cff;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 16px;text-align:center}
.shiny::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-100%);animation:sweep 2.6s ease-in-out infinite}
.shiny small{display:block;font:500 13px Anuphan,sans-serif;opacity:.92}
.shiny[aria-pressed=false]{filter:saturate(.55) brightness(.95)}
.shiny[aria-pressed=true]{box-shadow:0 0 0 4px var(--card),0 0 0 7px #ff3fa4,0 12px 30px -8px #c13cff}
.shiny .tick{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none}
@keyframes glow{to{background-position:300% 0}}@keyframes sweep{60%,100%{transform:translateX(100%)}}
.nightban{position:relative;overflow:hidden;border-radius:18px;padding:14px 16px;color:#fff;font-weight:600;background:linear-gradient(110deg,#5b2bff,#c13cff,#ff3fa4,#ffb020,#2fd1ff,#5b2bff);background-size:300% 100%;animation:glow 6s linear infinite}
.nightban::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-100%);animation:sweep 2.6s ease-in-out infinite}
.nightban b{font:700 20px Mali,sans-serif;display:block}
.nk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.nk button{min-height:64px;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;padding:8px 10px;line-height:1.3}
.nk button[aria-pressed=true]{border-color:#c13cff;background:light-dark(#f6ecff,#2e1a4a);box-shadow:0 0 0 3px light-dark(#f0dcff,#3a2160)}
.nightban .q{display:block;font:700 18px/1.35 Mali,sans-serif;margin-top:6px}
.disco{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9;border:0;background:none;padding:0;cursor:pointer;display:grid;justify-items:center;gap:2px;filter:drop-shadow(0 10px 16px rgba(90,40,200,.45))}
.disco svg{width:112px;height:138px;overflow:visible}
.disco .ball{animation:spin 6s linear infinite;transform-origin:39px 56px}
.disco .t{animation:twinkle 1.8s ease-in-out infinite}
.disco .spark{animation:sparkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.disco b{font:700 15px Mali,sans-serif;padding:5px 14px;border-radius:999px;color:#fff;white-space:nowrap;background:linear-gradient(110deg,#5b2bff,#c13cff,#ff3fa4,#ffb020,#2fd1ff,#5b2bff);background-size:300% 100%;animation:glow 4s linear infinite;margin-top:-6px}
.disco:active svg{transform:scale(.94)}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes sparkle{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
main{padding-bottom:240px}#ticket{scroll-margin-top:10px}

<main>
  <section id="alertBox" hidden></section>
  <section id="reqBox" class="stack-col" hidden></section>
  <section class="card" id="planner" hidden>
    <h2 id="pTitle">Where to today?</h2>
    <div class="sect" style="margin-top:4px"><h3 id="timeH">Pick-up time</h3><div class="times" id="times"></div></div>
    <div class="sect"><h3 id="placesH">Destinations</h3><div class="tiles" id="tiles"></div>
    <div class="newbox" id="newBox" hidden><input type="text" id="newIn" aria-label="New place"><button class="btn main" type="button" id="newAdd">Add</button></div></div>
    <div class="sect"><h3 id="tripH">Your trip</h3><div id="road"></div></div>
    <div class="sect" id="rageBox" hidden><div class="ragehd"><span>🪩 <b id="nightLbl">Rage night</b></span><button type="button" class="lnk" id="rageOff">Turn off</button></div><div class="nk" id="nightKinds"><button type="button" data-nk="tequila">🥃 Bring me a bottle of tequila to the office</button><button type="button" data-nk="doink">🌿 Roll me a 4-gram doink</button><button type="button" data-nk="bender">🌙 You're gonna stay with me all night</button><button type="button" data-nk="dawn">🌅 You'll be going home before sunrise</button></div></div>
    <div class="sect"><label class="switch"><input type="checkbox" id="fLong"><span id="lLong">Long trip (all day / out of town)</span></label>
      <label id="retWrap" hidden style="margin-top:12px"><span id="lRet">Back home around</span><input type="time" id="fRet"></label></div>
    <div class="sect"><label><span id="lNote">Note for my buddy</span><textarea id="fNote"></textarea></label></div>
    <button class="go" type="button" id="send">Let's Roll!</button>
    <div class="lane" id="lane" aria-hidden="true"><svg viewBox="0 0 64 36"><use href="#car"/></svg></div>
    <div class="row" style="margin-top:12px" id="cancelRow" hidden><button class="btn ghost" type="button" id="cancel">Cancel</button></div>
    <p class="status" id="fStatus" role="status"></p>
  </section>
  <section class="card" id="ticket" aria-live="polite"></section>
  <section class="card" id="hoursDay" hidden></section>
  <section class="card" id="quickLog" hidden></section>
  <section class="card" id="dropBox" hidden></section>
  <section><h3 id="upTitle">Coming up</h3><div class="list" id="upcoming"></div></section>
  <section class="hsum" id="hoursSum" hidden></section>
  <section class="pay" id="paySum" hidden></section>
  <section class="notes" id="notesBox" hidden></section>
  <section id="placesWrap" hidden><h3 id="plTitle">Saved places</h3><div class="pgrid" id="places"></div>
    <details id="addWrap" style="margin-top:10px"><summary id="addSum">+ Save a new place</summary>
      <form class="add" id="plForm"><label><span id="lPlName">Name</span><input type="text" id="pName"></label><label><span id="lPlAddr">Address or Google Maps link</span><input type="text" id="pAddr"></label><label><span id="lPlTel">Phone (optional)</span><input type="text" id="pTel" inputmode="tel"></label><label><span id="lPlPic">Photo of the entrance (optional)</span><input type="file" id="pPic" accept="image/*"></label><div><b style="font-size:15px">Sticker (optional)</b><div class="ipick" id="pIcons" style="margin-top:6px"></div></div><div class="row"><button class="btn main" type="submit" id="pSave">Save place</button><button class="btn ghost" type="button" id="pCancel">Cancel</button></div><p class="status" id="pStatus"></p></form>
    </details></section>
  <p class="hint" id="conn"></p>
</main>
